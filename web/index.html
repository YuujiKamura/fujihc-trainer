<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>fujihc viewer (phase 0)</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  #hud {
    position: fixed; left: 1rem; bottom: 1rem; z-index: 999;
    color: #fff; font: 14px/1.5 ui-monospace, "Cascadia Code", monospace;
    background: rgba(0, 0, 0, 0.65); padding: 0.6rem 0.9rem; border-radius: 6px;
    pointer-events: none; min-width: 14rem;
  }
  #hud b { color: #ffd54a; }
  #controls {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 999;
    color: #fff; font: 13px ui-monospace, monospace;
    background: rgba(0, 0, 0, 0.65); padding: 0.6rem 0.9rem; border-radius: 6px;
  }
  #controls button { font: inherit; margin: 0 0.2rem; padding: 0.2rem 0.6rem; }
  #status {
    position: fixed; left: 1rem; top: 1rem; z-index: 999;
    color: #aaa; font: 12px ui-monospace, monospace;
    background: rgba(0, 0, 0, 0.5); padding: 0.3rem 0.6rem; border-radius: 4px;
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="hud">
  <b>dist</b>  <span id="dist">0</span> / <span id="total">?</span> m<br>
  <b>ele</b>   <span id="ele">0</span> m<br>
  <b>slope</b> <span id="slope">0</span> %<br>
  <b>speed</b> <span id="speed">0</span> m/s (test)
</div>
<div id="controls">
  <button id="btnPause">pause</button>
  <button id="btnSlow">slow</button>
  <button id="btnFast">fast</button>
  <button id="btnReset">reset</button>
</div>
<div id="status">loading course.json...</div>
<script src="viewer.js"></script>
</body>
</html>
