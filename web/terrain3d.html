<!DOCTYPE html>
<!--
  brief b7: 富士ヒルコースの地形を Three.js の本物の 3D メッシュとして表示する
  スタンドアロンページ (= Path B viewer の基礎石)。

  MapLibre は使わない。 DEM (= 国土地理院 GSI dem_png 標高タイル) から標高グリッドを組み、
  BufferGeometry の頂点格子へ直接変位させる。 inertia-sim.html と同じ独立ページで、
  本番 viewer (index.html / viewer-maplibre.js) には一切触れない。

  データ経路の純関数は web/lib/terrain3d.js (= node test で pin 済)。 本ファイルは
  fetch + Canvas decode + Three.js mesh 化という I/O / 描画層だけを担う。

  地図タイルの取得について (= GSI 地理院タイル利用規約への配慮):
   - DEM / 地図画像とも国土地理院の地理院タイルを使う。 出典は画面下部に明記する。
   - 「大量アクセスの自粛」規約に配慮し、 ページを開いた 1 回だけ、 コース外接矩形を
     覆う数十枚のみを取得する (= 通常の地図 1 画面表示と同等)。 同時接続は GSI_FETCH_LIMIT
     で 6 本に絞り、 取得枚数は MAX_TILES で上限を設ける。 自動再取得・ループ取得はしない。
   - 参照: 地理院タイル一覧・利用規約 https://maps.gsi.go.jp/development/ichiran.html
           標高タイル (dem_png) 仕様   https://maps.gsi.go.jp/development/demtile.html

  Three.js は inertia-sim.html と同じ vendored r160 (./lib/vendor/three.module.js)。
   - BufferGeometry:       https://threejs.org/docs/#api/en/core/BufferGeometry
   - computeVertexNormals: https://threejs.org/docs/#api/en/core/BufferGeometry.computeVertexNormals
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地形 3D — 富士ヒルトレーナー (Path B 基礎)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden;
               font-family: -apple-system, "Segoe UI", sans-serif; color: #e6edf3; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; }

  .panel { position: absolute; background: rgba(20,26,34,0.92); border: 1px solid #30363d;
           border-radius: 8px; padding: 10px 13px; font-size: 12px; line-height: 1.5; }
  #info { left: 12px; top: 12px; width: 260px; }
  #info h2 { margin: 0 0 6px; font-size: 13px; color: #58a6ff; font-weight: 600; }
  #info .metric { display: flex; justify-content: space-between; }
  #info .metric span { color: #8b949e; }
  #info b { font-variant-numeric: tabular-nums; }
  #status { left: 12px; bottom: 12px; right: 12px; max-width: 540px; }
  #status.err { border-color: #f85149; color: #ffa198; }
  /* コースの勾配色分け凡例。 */
  #legend { left: 12px; bottom: 58px; width: 230px; }
  #legend h2 { margin: 0 0 5px; font-size: 12px; color: #58a6ff; font-weight: 600; }
  #legend-bar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; }
  #legend-bar div { flex: 1; }
  #legend-ticks { display: flex; justify-content: space-between;
                  font-size: 10px; color: #8b949e; margin-top: 3px; }
  /* 出典クレジット (= 地理院タイル利用規約の出典明記義務)。
     position:absolute が無いと right/bottom が効かず、 通常フローの静的ブロックとして
     ページ最上部に置かれ、 inset:0 の canvas の裏に隠れて画面に出ない (= 旧実装の不具合)。
     暗い地形の上でも必ず視認できるよう、 明色テキスト + 不透明背景 + 枠でコントラスト確保。 */
  #attrib { position: absolute; right: 12px; bottom: 12px;
            font-size: 12.5px; color: #e6edf3;
            background: rgba(13,17,23,0.94); border: 1px solid #30363d;
            padding: 6px 10px; border-radius: 6px; }
  #attrib a { color: #58a6ff; }
  .hint { color: #8b949e; font-size: 10.5px; margin-top: 6px; }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="info" class="panel">
  <h2>富士ヒルコース 地形</h2>
  <div class="metric"><span>頂点数</span><b id="m-verts">—</b></div>
  <div class="metric"><span>標高レンジ</span><b id="m-ele">—</b></div>
  <div class="metric"><span>範囲 (東西×南北)</span><b id="m-size">—</b></div>
  <div class="metric"><span>DEM タイル</span><b id="m-tiles">—</b></div>
  <div class="metric"><span>DEM 取得元</span><b id="m-demsrc">—</b></div>
  <div class="hint">ドラッグで回転、 ホイールで拡大縮小。</div>
</div>


<div id="legend" class="panel">
  <h2>コースの勾配</h2>
  <div id="legend-bar"></div>
  <div id="legend-ticks"><span>0%</span><span>6%</span><span>12%</span><span>18%+</span></div>
</div>

<div id="status" class="panel">起動中…</div>
<div id="attrib">地形・地図画像: <a href="https://maps.gsi.go.jp/" target="_blank" rel="noopener">国土地理院</a></div>

<script type="importmap">
{ "imports": { "three": "./lib/vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import {
  tileRangeForBounds, decodeGsiHeightGrid,
  stitchHeightGrid, buildTerrainGeometry, buildCoursePath, buildCourseRibbon,
  courseBounds,
} from './lib/terrain3d.js';
import { gradeColorContinuous } from './lib/route_styling.js';
import { buildRoadMarks, slopeAtDistance } from './lib/road_texture.js';
import { integratePhysics } from './lib/bike_physics.js';
import { createTerrain } from './lib/terrain.js';
import { createRider } from './lib/rider.js';
import { riderPlacementAtDistance } from './lib/rider_placement.js';

// === 定数 ===
// GSI dem_png の native zoom は 14 (= 256x256 で約 6m grid、 terrain_mesh.js 準拠)。
const DEM_ZOOM = 14;
// bbox は course から動的に算出 (= main() で courseBounds(course, TERRAIN_BUFFER_M) を呼ぶ)。
// 固定 bbox 廃止の理由: コース長さに連動した最小範囲になり、
// GSI タイル取得数を course 実データから最小化できる。
// 1500m buffer で富士ヒルコースの実測: 5×7 = 35 tiles。
const TERRAIN_BUFFER_M = 1500;
// 取得タイル数の上限。 courseBounds 1500m で約 35 枚、
// 余裕を見て 200 を上限とし、 超えたら地形を組まずエラー表示 (= 規約配慮の物理 gate)。
const MAX_TILES = 200;
// GSI への同時接続数 (= 大量アクセス自粛への配慮、 1 画面 1 回のみ取得)。
const GSI_FETCH_LIMIT = 6;
const TILE_PX = 256;
// メッシュ頂点格子の片辺の目標上限。 数枚×256px を 1:1 頂点化すると数百万頂点になるため、
// stitch 後のグリッドを step 間引きしてこの程度に収める。
const TARGET_GRID_DIM = 400;
const GSI_BASE = 'https://cyberjapandata.gsi.go.jp/xyz';
// DEM タイルの取得元。 bridge (= 既存 viewer の配信元) が同一オリジンで
// /tiles/gsi_dem を配信していればそれを使い (= 既存のコースタイル DB を再利用、
// GSI への外部アクセスなし)、 無ければ GSI online (dem_png) にフォールバックする。
// bridge の /tiles/gsi_dem は GSI dem_png 形式そのまま (= viewer の gsidem:// と同じ)
// なので decodeGsiHeightGrid がそのまま通る。
const GSI_DEM_ONLINE = `${GSI_BASE}/dem_png`;
const LOCAL_DEM_BASE = `${location.origin}/tiles/gsi_dem`;
// テクスチャは航空写真 (seamlessphoto) 固定。 std/relief/hybrid は GSI サーバ負荷の
// 観点から封印 (1 ユーザが複数レイヤを重ねるとリクエストが倍増するため)。

const statusEl = document.getElementById('status');
function status(msg, isErr) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('err', !!isErr);
}

// === 並列数を絞った map ===
async function mapLimit(items, limit, fn, onEach) {
  const out = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      out[i] = await fn(items[i], i);
      if (onEach) onEach();
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

// crossOrigin 付きで画像を読む。 失敗 (= 404 等) は null で解決 (= reject しない)。
function loadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// GSI の指定レイヤのタイル群を 1 枚の canvas に貼り合わせて返す (= 地形テクスチャ用)。
async function fetchLayerCanvas(gsiLayer, ext, tileCoords, range, label) {
  const cv = document.createElement('canvas');
  cv.width = range.tilesX * TILE_PX;
  cv.height = range.tilesY * TILE_PX;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#3b424c';
  ctx.fillRect(0, 0, cv.width, cv.height);
  let done = 0;
  await mapLimit(tileCoords, GSI_FETCH_LIMIT, async ({ tx, ty }) => {
    const img = await loadImage(`${GSI_BASE}/${gsiLayer}/${DEM_ZOOM}/${tx}/${ty}.${ext}`);
    if (img) {
      ctx.drawImage(img, (tx - range.xMin) * TILE_PX, (ty - range.yMin) * TILE_PX,
        TILE_PX, TILE_PX);
    }
  }, () => status(`${label} 取得中… ${++done}/${tileCoords.length}`));
  return cv;
}

// 航空写真テクスチャを組む。
async function buildPhotoTexture(tileCoords, range) {
  const canvas = await fetchLayerCanvas('seamlessphoto', 'jpg', tileCoords, range, '航空写真');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  return tex;
}

// brief b11-Phase2: コース道路リボンに貼る「路面に焼いた距離・勾配」テクスチャを組む。
// 数値ロジック (どこに何の数字を焼くか) は road_texture.js の純関数 buildRoadMarks /
// slopeAtDistance が担い node test 済 ── 本関数は新しい数値ロジックを持たず、
// その出力と gradeColorContinuous を canvas API で描くだけ (= 他の描画コードと同じ
// 実画面目視で検証する層)。
//   ROAD_TEX_W: u 軸 = 約 24km の進行方向。 GPU テクスチャ幅の一般的上限 16384 を採り、
//     最も引き伸びる軸の解像度を上限まで上げる。 24000m/16384 ≒ 1.46 m/px。
//   ROAD_TEX_H: v 軸 = 路面幅 24m。 勾配色は幅方向一様で解像度要求が低く、 数字の
//     縦エッジが出れば足りるので 128 (= 24m/128 ≒ 0.19 m/px)。 全体 16384×128×4B = 8MB。
const ROAD_TEX_W = 16384;
const ROAD_TEX_H = 128;

// 路面ペイント風の数字 1 行。 白字 + 暗い縁取りで勾配色 (緑〜紫) のどこでも視認可。
function drawRoadText(ctx, text, x, y, fontPx) {
  ctx.font = `bold ${fontPx}px -apple-system, "Segoe UI", sans-serif`;
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, fontPx * 0.16);
  ctx.strokeStyle = 'rgba(15,20,30,0.92)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y);
}

function buildRoadTextureCanvas(course, marks) {
  const W = ROAD_TEX_W, H = ROAD_TEX_H;
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d');
  const total = marks.totalDistanceM;
  // 1. 背景 = 距離方向に勾配色 (= 道路の色を全部テクスチャが持つ)。 列ごとに
  //    slopeAtDistance → gradeColorContinuous。 slopeAtDistance が勾配の唯一の SoT。
  for (let x = 0; x < W; x++) {
    const d = (x / W) * total;
    ctx.fillStyle = gradeColorContinuous(slopeAtDistance(course, d));
    ctx.fillRect(x, 0, 1, H);
  }
  // 2. minor 刻み = 約 100m ごとの細い横線 (= 距離の目安、 数字なし)。
  ctx.strokeStyle = 'rgba(255,255,255,0.30)';
  ctx.lineWidth = 2;
  for (const mk of marks.minor) {
    const x = mk.u * W;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  // 3. major 刻み = 約 1km ごとの太い横線 + 数字 (距離 km / 勾配 %)。
  //    距離は major マークの実距離 (整数 km ちょうど)、 勾配は mk.slope_pct
  //    (= slopeAtDistance の実値) を 1 桁。 切りの良い偽の丸め値は出さない。
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const mk of marks.major) {
    const x = mk.u * W;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
    drawRoadText(ctx, `${mk.distance_m / 1000}km`, x, H * 0.31, 58);
    drawRoadText(ctx, `${mk.slope_pct.toFixed(1)}%`, x, H * 0.72, 46);
  }
  return cv;
}

// brief b11-Phase3: rider の 3D 自転車 mesh を Three.js primitive で組む。
// 単位モデル ── 全長 1.0 (Z 方向)、 前方 -Z、 車輪の接地点が group の y=0。
// 配置側 (= riderStartPlacement の結果) が span 比例で scale / position / lookAt する。

// from→to を結ぶ円柱 (= フレームチューブ) を group に足す。 CylinderGeometry は
// +Y 軸なので、 quaternion で from→to 方向へ回す。
function addBikeTube(group, material, from, to, radius) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, len, 10), material);
  mesh.position.copy(from).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0), dir.normalize());
  group.add(mesh);
}

function buildBikeMesh() {
  const group = new THREE.Group();
  // 陰影で 3D の形が読めるよう StandardMaterial (= シーンの太陽光 + 環境光を受ける)。
  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x18c8ff, roughness: 0.4, metalness: 0.3 });   // 明るいシアン (路面の暖色に映える)
  const wheelMat = new THREE.MeshStandardMaterial({
    color: 0x14181f, roughness: 0.75, metalness: 0.1 });  // ほぼ黒のタイヤ
  const partMat = new THREE.MeshStandardMaterial({
    color: 0x2a2f3a, roughness: 0.6, metalness: 0.2 });   // サドル / ハンドル

  // 全長 1.0 になる寸法: (rearZ + wheelR) - (frontZ - wheelR) = 0.56 + 0.44 = 1.0。
  const wheelR = 0.22, tubeR = 0.04;
  const frontZ = -0.28, rearZ = 0.28;
  const hubY = wheelR;  // 車輪の接地点が group の y=0 になる高さ

  // 車輪 2 枚 (トーラス)。 既定で XY 平面のリング (法線 Z) なので、 rotation.y=π/2 で
  // 車軸を X 方向にし、 車輪の円盤が進行方向 (Z) を含む面に立つ。
  for (const z of [frontZ, rearZ]) {
    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(wheelR, tubeR, 12, 28), wheelMat);
    wheel.rotation.y = Math.PI / 2;
    wheel.position.set(0, hubY, z);
    group.add(wheel);
  }

  // フレーム: 前後ハブ・ボトムブラケット・サドル・ハンドルを円柱で繋ぐ。
  const frontHub = new THREE.Vector3(0, hubY, frontZ);
  const rearHub  = new THREE.Vector3(0, hubY, rearZ);
  const bb       = new THREE.Vector3(0, hubY * 0.7, 0.05);  // ボトムブラケット
  const saddle   = new THREE.Vector3(0, 0.60, 0.20);
  const bar      = new THREE.Vector3(0, 0.54, -0.24);       // ハンドル付近
  const ft = 0.038;
  addBikeTube(group, frameMat, rearHub, bb, ft);     // チェーンステー
  addBikeTube(group, frameMat, bb, saddle, ft);      // シートチューブ
  addBikeTube(group, frameMat, rearHub, saddle, ft); // シートステー
  addBikeTube(group, frameMat, bb, bar, ft);         // ダウンチューブ
  addBikeTube(group, frameMat, saddle, bar, ft);     // トップチューブ
  addBikeTube(group, frameMat, frontHub, bar, ft);   // フォーク

  // サドル / ハンドルバー (= 自転車と読めるための小さな箱)。
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.035, 0.18), partMat);
  seat.position.copy(saddle);
  group.add(seat);
  const handlebar = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.04, 0.05), partMat);
  handlebar.position.copy(bar);
  group.add(handlebar);

  return group;
}

// DEM タイル取得元を解決する。 range 中央付近の z14 タイルを 1 枚 probe し、
// 同一オリジンの local tile DB が応答すればそれを使う (= 既存コースタイルの再利用)。
async function resolveDemBase(range) {
  const cx = range.xMin + Math.floor(range.tilesX / 2);
  const cy = range.yMin + Math.floor(range.tilesY / 2);
  try {
    const r = await fetch(`${LOCAL_DEM_BASE}/${DEM_ZOOM}/${cx}/${cy}.png`,
      { cache: 'no-store' });
    if (r && r.ok) return { base: LOCAL_DEM_BASE, local: true };
  } catch (e) { /* local 無し → online へ */ }
  return { base: GSI_DEM_ONLINE, local: false };
}

// DEM タイル 1 枚を decode して標高グリッド (Float32Array) を返す。 欠損は null。
async function loadDemGrid(demBase, tx, ty) {
  const img = await loadImage(`${demBase}/${DEM_ZOOM}/${tx}/${ty}.png`);
  if (!img) return null;
  const c = document.createElement('canvas');
  c.width = TILE_PX; c.height = TILE_PX;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, TILE_PX, TILE_PX);
  const rgba = ctx.getImageData(0, 0, TILE_PX, TILE_PX).data;
  return decodeGsiHeightGrid(rgba, TILE_PX, TILE_PX);
}

// コース勾配の凡例バーを gradeColorContinuous で塗る (= チューブと同一パレット)。
(function buildLegend() {
  const bar = document.getElementById('legend-bar');
  const N = 28, MAX_SLOPE = 18;
  for (let i = 0; i < N; i++) {
    const cell = document.createElement('div');
    cell.style.background = gradeColorContinuous((i / (N - 1)) * MAX_SLOPE);
    bar.appendChild(cell);
  }
})();

// === メイン ===
async function main() {
  // 1. course.json からコース bounding box を出す。
  status('コース読み込み中…');
  const courseResp = await fetch('./course.json', { cache: 'no-store' });
  if (!courseResp.ok) throw new Error(`course.json HTTP ${courseResp.status}`);
  const course = await courseResp.json();
  if (!Array.isArray(course) || course.length === 0) {
    throw new Error('course.json が空です');
  }
  // 地形は富士山の外周まで覆う固定 bbox を使う (= course 沿いの細い帯ではなく)。
  const bounds = courseBounds(course, TERRAIN_BUFFER_M);
  const range = tileRangeForBounds(bounds, DEM_ZOOM);
  if (range.count > MAX_TILES) {
    throw new Error(`DEM タイルが ${range.count} 枚で上限 ${MAX_TILES} 超過 (= 取得を中止)`);
  }
  document.getElementById('m-tiles').textContent =
    `${range.count} 枚 (${range.tilesX}×${range.tilesY}, z${DEM_ZOOM})`;

  // 2. DEM タイル群を取得・decode し、 範囲全体の標高グリッドへ連結。
  //    取得元は local tile DB (= bridge 配信) 優先、 無ければ GSI online。
  const demSrc = await resolveDemBase(range);
  document.getElementById('m-demsrc').textContent =
    demSrc.local ? 'ローカル DB (bridge)' : 'GSI online';
  const tileCoords = [];
  for (let ty = range.yMin; ty <= range.yMax; ty++) {
    for (let tx = range.xMin; tx <= range.xMax; tx++) tileCoords.push({ tx, ty });
  }
  let demDone = 0;
  const demGrids = await mapLimit(tileCoords, GSI_FETCH_LIMIT, async ({ tx, ty }) => {
    const g = await loadDemGrid(demSrc.base, tx, ty);
    return { tx, ty, grid: g };
  }, () => status(`DEM タイル取得中… ${++demDone}/${tileCoords.length}`));

  const tileMap = new Map();
  let missing = 0;
  for (const d of demGrids) {
    if (d.grid) tileMap.set(`${d.tx}/${d.ty}`, d.grid);
    else missing++;
  }
  if (tileMap.size === 0) {
    throw new Error('DEM タイルが 1 枚も取得できませんでした (= ネットワーク / CORS を確認)');
  }
  const stitched = stitchHeightGrid(tileMap, range, TILE_PX);

  // 3. 標高グリッドから Three.js 地形メッシュの頂点配列を組む。
  status('地形メッシュ生成中…');
  const step = Math.max(1, Math.ceil(Math.max(stitched.width, stitched.height) / TARGET_GRID_DIM));
  const geo = buildTerrainGeometry(stitched, range, { tileSize: TILE_PX, step });

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(geo.positions, 3));
  geometry.setAttribute('uv', new THREE.BufferAttribute(geo.uvs, 2));
  geometry.setIndex(new THREE.BufferAttribute(geo.indices, 1));
  geometry.computeVertexNormals();

  // 4. 地形に貼るテクスチャ。 航空写真 (seamlessphoto) 固定。
  const texture = await buildPhotoTexture(tileCoords, range);

  const material = new THREE.MeshStandardMaterial({
    map: texture, roughness: 1.0, metalness: 0.0, side: THREE.DoubleSide,
  });
  const mesh = new THREE.Mesh(geometry, material);

  // === シーン構築 ===
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1117);
  const midH = (geo.minH + geo.maxH) / 2;
  const span = Math.max(geo.sizeX, geo.sizeZ);
  scene.fog = new THREE.Fog(0x0d1117, span * 0.9, span * 2.6);
  scene.add(mesh);

  // コースを地形に重ねる: course.json (= GPX 由来) の点列を、 地形と同じ投影で
  // 「地形表面に沿う平たいリボン (= 道路状の帯)」mesh として描く。 リボンの両端は
  // DEM 標高でそれぞれ drape し起伏に沿わせる。 路面の色 (勾配色) と距離・勾配の
  // 数字は、 リボンの uv に貼る 1 枚のテクスチャに焼き込む (= brief b11-Phase2)。
  // 始点 (緑) / 5合目 終点 (橙) に球マーカー。
  const ribbon = buildCourseRibbon(course, {
    range, stitched, centerLat: geo.centerLat, centerLon: geo.centerLon,
    tileSize: TILE_PX,
    // 道幅: 実コースは約 7-8m だが地形スケール (~10km) で見えるよう span 比例で誇張。
    widthM: span * 0.0055,
    drapeOffset: span * 0.0013,  // 地形表面のすぐ上 (= z-fighting 回避の最小持ち上げ)
  });
  const ribbonGeo = new THREE.BufferGeometry();
  ribbonGeo.setAttribute('position', new THREE.BufferAttribute(ribbon.positions, 3));
  // uv = u(距離 0..1) / v(幅 0..1)。 道路テクスチャをこの uv で路面に貼る。
  ribbonGeo.setAttribute('uv', new THREE.BufferAttribute(ribbon.uvs, 2));
  ribbonGeo.setIndex(new THREE.BufferAttribute(ribbon.indices, 1));
  // 道路テクスチャ: 距離マーク (約 1km の数字 / 約 100m の刻み) と勾配色を canvas に
  // 焼き、 リボンの uv で路面に貼る。 数字・色は course の実値 (road_texture.js)。
  const roadMarks = buildRoadMarks(course, { majorIntervalM: 1000, minorIntervalM: 100 });
  const roadTexture = new THREE.CanvasTexture(buildRoadTextureCanvas(course, roadMarks));
  roadTexture.colorSpace = THREE.SRGBColorSpace;
  roadTexture.anisotropy = 8;  // 異方テクセル (進行方向に 1px≒1.46m) の滲み低減。
  roadTexture.flipY = false;   // canvas の上 = uv v=0 (= 数字が上下反転しない)。
  // 陰影なしの texture material (= 法線・winding 不問、 DoubleSide で裏面も描く)。
  scene.add(new THREE.Mesh(ribbonGeo, new THREE.MeshBasicMaterial({
    map: roadTexture, side: THREE.DoubleSide,
  })));
  // 始点 / 終点マーカー用にコース中心線の両端だけ投影する。
  const coursePath = buildCoursePath(course, {
    range, stitched, centerLat: geo.centerLat, centerLon: geo.centerLon,
    tileSize: TILE_PX, drapeOffset: span * 0.004,
  });
  const coursePts = [];
  for (let i = 0; i < coursePath.length; i += 3) {
    coursePts.push(new THREE.Vector3(coursePath[i], coursePath[i + 1], coursePath[i + 2]));
  }
  // 終点 (5合目) マーカーの球。 始点側は Phase 3 で rider の自転車 mesh を置くので
  // 球マーカーは不要 (= 自転車自体が始点を示す。 球を残すと自転車に重なって隠す)。
  const endMark = new THREE.Mesh(
    new THREE.SphereGeometry(span * 0.008, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xf0883e }));
  endMark.position.copy(coursePts[coursePts.length - 1]);
  scene.add(endMark);

  // brief b11-Phase4: terrain / rider を生成し、 固定パワー 250W で物理積分する。
  // Phase 3 の静止配置は loop() 内の毎フレーム再配置に置き換える。
  // BLE 実パワーは Phase 7 で integratePhysics の引数に差し替わる ── ループ形は不変。
  const terrain = createTerrain({ course });
  const rider = createRider({ terrain });
  rider.start();
  const RIDE_POWER_W = 250;
  const bike = buildBikeMesh();
  bike.scale.setScalar(span * 0.011);
  scene.add(bike);

  // 5. ライティング: 太陽 (DirectionalLight) + 環境 (Ambient + Hemisphere)。
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.0);
  sun.position.set(-span * 0.6, span * 0.8, span * 0.5);
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x202820, 0.6));

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  wrap.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(50, 1, 1, span * 6);
  // 6. カメラ: 地形中心 (target) のまわりを球面で回す簡易オービット操作。
  // 初期向きは北麓 (= 富士スバルライン側) の上空から南の山頂を見上げる構図。
  // theta=π で地形の北 (-Z) 側にカメラを置き南を向くと、 富士山頂が画面奥=上に立ち、
  // コースの載る北斜面が手前に広がる。 ?cam=top で真上俯瞰の検証ビューに切替可。
  const target = new THREE.Vector3(0, midH, 0);
  const orbit = { radius: span * 1.3, theta: Math.PI, phi: Math.PI * 0.34 };
  const PHI_MIN = 0.12, PHI_MAX = Math.PI * 0.49;
  // ?cam=top で真上からの北上俯瞰 (= 地図と直接照合できる検証ビュー)。
  // camera.up を北 (-Z) に向けると、 北が画面上・東が画面右の正しい地図向きになる。
  const topMode = new URLSearchParams(location.search).get('cam') === 'top';
  function applyCamera() {
    if (topMode) {
      camera.up.set(0, 0, -1);  // 北 (= -Z) を画面上に
      camera.position.set(target.x, target.y + orbit.radius, target.z);
      camera.lookAt(target);
      return;
    }
    camera.up.set(0, 1, 0);
    orbit.phi = Math.min(PHI_MAX, Math.max(PHI_MIN, orbit.phi));
    // 最大拡大 (= 最小 radius) は span*0.03。 span は地形全体 (= 富士山外周まで
    // 含む広域) のため、 旧 span*0.18 ではコース・rider に寄れない (= 拡大キャップが
    // 狭すぎる)。 地形が広がっても rider 周辺まで寄れるよう係数を小さく取る。
    orbit.radius = Math.min(span * 3.5, Math.max(span * 0.03, orbit.radius));
    camera.position.set(
      target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      target.y + orbit.radius * Math.cos(orbit.phi),
      target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta),
    );
    camera.lookAt(target);
  }

  // マウス操作 (= ポインタ占有しない、 ドラッグとホイールのみ)。
  let dragging = false, lastX = 0, lastY = 0;
  renderer.domElement.addEventListener('mousedown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    orbit.theta -= (e.clientX - lastX) * 0.005;
    orbit.phi -= (e.clientY - lastY) * 0.005;
    lastX = e.clientX; lastY = e.clientY;
    applyCamera();
  });
  renderer.domElement.addEventListener('wheel', (e) => {
    e.preventDefault();
    orbit.radius *= (e.deltaY > 0 ? 1.1 : 0.9);
    applyCamera();
  }, { passive: false });

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  applyCamera();

  // HUD 更新。
  document.getElementById('m-verts').textContent = geo.vertexCount.toLocaleString();
  document.getElementById('m-ele').textContent =
    `${Math.round(geo.minH)} – ${Math.round(geo.maxH)} m`;
  document.getElementById('m-size').textContent =
    `${(geo.sizeX / 1000).toFixed(1)} × ${(geo.sizeZ / 1000).toFixed(1)} km`;
  const tileNote = missing > 0 ? ` (${missing} 枚欠損→0m補完)` : '';
  status(`航空写真 — 富士ヒルコース ${course.length} 点の外接範囲 + コースライン${tileNote}`);

  // 物理 state: physicsSpeedMps は integratePhysics の出力を引き継ぐ累積速度。
  // lastT は dt 計算の基準時刻。 dt は min(dt, 0.1) で cap (= タブ非アクティブ対策)。
  let physicsSpeedMps = 0;
  let lastT = performance.now();

  function loop() {
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;

    const slope = terrain.getPositionAtDistance(rider.distanceTraveled).slope_pct;
    physicsSpeedMps = integratePhysics(physicsSpeedMps, dt, RIDE_POWER_W, slope);
    rider.setSpeed(physicsSpeedMps);
    rider.tick(dt);

    // bike mesh は -Z 前方。 model 前方ベクトル (0,0,-1) を forward へ直接回す。
    const pl = riderPlacementAtDistance(ribbon.positions, course, rider.distanceTraveled);
    bike.position.set(pl.position[0], pl.position[1], pl.position[2]);
    bike.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 0, -1),
      new THREE.Vector3(pl.forward[0], pl.forward[1], pl.forward[2]));

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
}

main().catch((e) => {
  console.error(e);
  status(`地形の表示に失敗: ${e && e.message || e}`, true);
});
</script>
</body>
</html>
