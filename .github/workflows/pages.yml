# brief 33: GitHub Pages 静的サイト配信 workflow。
# trigger: push to main + 手動 (workflow_dispatch)。
# pipeline (= revision 5 改修):
#   checkout → setup-python → setup-node → install deps
#     → export_static.py (= web/static/ を local SQLite から構築、 既存)
#     → build_pages.py (= _site/ を web/ から生成 + Strava 除外 + CSP rewrite + sw.js bump、 新規 b33)
#     → vitest viewer URL audit (= _site/ artifact pin、 新規 b33)
#     → playwright e2e pages_audit (= oauth-callback 404、 新規 b33)
#     → upload-pages-artifact → deploy-pages
#
# 旧 `Stage Pages payload` step (= mkdir _site / cp web/index.html / cp -r web/lib / cp -r web/static)
# と `Verify static assets staged` (= dem_count >= 100 gate) は build_pages.py に統合して撤去 (= b33 軸 5 fix)。
# action 全て major version 完全 pin (= NG-R3-7 floating tag 禁止)。
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, b11-phase5-tile-cache]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時 deploy を 1 つに制限 (= 連続 push でも最新だけが反映)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install -e .

      - name: Install Node deps
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # b33: _site/ を web/ から生成 + Strava 除外 + CSP rewrite + sw.js cache bump
      # 旧 `Export static assets` (= export_static.py で web/static/ を local SQLite から構築) は
      # 撤去 (= b31 で訪問者単位 runtime fetch + IndexedDB に移行済、 CI には local DB が無いので
      # `no such table: tiles` で fail する、 役割終了)。
      - name: Build Pages payload (b33)
        run: python scripts/build_pages.py

      # b33: vitest viewer URL audit を _site/ artifact に対して走らせて Strava 除外を pin
      - name: vitest viewer URL audit
        working-directory: web
        run: npm test -- viewer_url_audit.test.js

      # b33: playwright e2e で oauth-callback.html が 404 を返すことを pin
      - name: playwright e2e (pages audit)
        working-directory: web
        run: npx playwright test --config=../e2e/playwright.pages.config.js
        env:
          PAGES_AUDIT: '1'

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
