[project]
name = "fujihc-trainer"
version = "0.0.1"
description = "Indoor trainer driver for the Mt.Fuji hill climb GPX. Phase 0: discover BLE trainers."
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22.0",
    "gpxpy>=1.6.0",
    "pmtiles>=3.0",
    "websockets>=12.0",
]

[project.scripts]
fujihc-discover = "fujihc.discover:main"
fujihc-bridge = "fujihc.bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
