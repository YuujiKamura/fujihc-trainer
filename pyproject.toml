[project]
name = "fujihill-trainer"
version = "0.0.1"
description = "Indoor trainer driver for the Mt.Fuji hill climb GPX. Phase 0: discover BLE trainers."
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<4",
    "beautifulsoup4>=4.12,<5",
    "bleak>=0.22.0,<1",
    "gpxpy>=1.6.0,<2",
    "pmtiles>=3.0,<4",
    "websockets>=12.0,<16",
]

[project.scripts]
fujihill-discover = "fujihill.discover:main"
fujihill-bridge = "fujihill.bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
