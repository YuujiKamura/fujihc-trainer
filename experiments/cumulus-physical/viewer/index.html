<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>PySDM cumulus 物理雲 viewer (= b98 Phase 3 単体 demo)</title>
  <style>
    body { margin: 0; background: #1a2238; color: #eee; font-family: sans-serif; overflow: hidden; }
    #info {
      position: absolute; top: 10px; left: 10px; padding: 10px 14px;
      background: rgba(0,0,0,0.55); border-radius: 6px; font-size: 13px; line-height: 1.5;
      max-width: 420px;
    }
    #info h1 { margin: 0 0 6px 0; font-size: 15px; }
    #info p { margin: 4px 0; }
    #snapshot-buttons button, #cam-buttons button, #util-buttons button {
      margin: 4px 6px 4px 0; padding: 4px 10px; background: #335; color: #eee;
      border: 1px solid #557; border-radius: 4px; cursor: pointer;
    }
    #snapshot-buttons button.active, #cam-buttons button.active { background: #58a; }
    #info.collapsed > *:not(#collapse-btn) { display: none; }
    #info.collapsed { padding: 4px 8px; }
    #time-slider { width: 100%; }
    .control-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    .control-row label { font-size: 11px; min-width: 60px; opacity: 0.8; }
    #collapse-btn {
      position: absolute; top: 4px; right: 6px; background: transparent;
      border: none; color: #eee; cursor: pointer; font-size: 14px;
    }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="info">
    <button id="collapse-btn" title="情報パネル折りたたみ">×</button>
    <h1>PySDM 物理雲 voxel viewer (b98 Phase 3)</h1>
    <p id="meta-grid"></p>
    <p id="meta-product"></p>
    <p style="margin: 4px 0; font-size: 11px; opacity: 0.7;">dataset (= 上昇流の強さ違い):</p>
    <div id="dataset-buttons"></div>
    <p style="margin: 4px 0; font-size: 11px; opacity: 0.7;">product (= PySDM 出力の物理量):</p>
    <div id="product-buttons"></div>
    <div class="control-row">
      <label>time:</label>
      <input id="time-slider" type="range" min="0" max="90" value="18" step="1">
      <span id="time-label" style="font-size: 11px; min-width: 60px;">step 18</span>
    </div>
    <p style="margin: 4px 0; font-size: 11px; opacity: 0.7;">CP (= URL ?cam=top|side|iso|close):</p>
    <div id="cam-buttons"></div>
    <p style="margin: 4px 0; font-size: 11px; opacity: 0.7;">render mode:</p>
    <div id="mode-buttons"></div>
    <p style="margin: 4px 0; font-size: 11px; opacity: 0.7;">buffer:</p>
    <div id="util-buttons">
      <button id="save-png">Save PNG (= canvas → download)</button>
    </div>
    <p style="font-size: 11px; opacity: 0.7;">
      ノイズ無し。 PySDM の super-droplet 粒子計算結果を voxel として線形 sampling、
      shader 装飾なしの直出し。 dataset / product / 時間切替で 2 × 4 × 91 view。
    </p>
  </div>
  <div id="canvas-container"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const VERT = `
      varying vec3 vWorldPos;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `;

    const FRAG = `
      precision highp float;
      varying vec3 vWorldPos;

      uniform vec3 uCameraPos;
      uniform float uDensity[625];
      uniform float uReffMean_um;  // dataset の雲粒有効半径平均 [μm]、 1 個 (= uniform 数 limit 回避)
      uniform float uDensityMax;
      uniform float uQlMax_gkg;    // ql の global max [g/kg]、 物理単位復元用
      uniform vec3 uBoxMin;
      uniform vec3 uBoxMax;
      uniform vec3 uSunDir;
      uniform int uMode;           // 0=voxel (= 既存)、 1=scatter (= 物理駆動ミー散乱)

      float sampleDensity2D(vec2 gridXZ) {
        gridXZ = clamp(gridXZ, vec2(0.0), vec2(23.999));
        int ix = int(floor(gridXZ.x));
        int iz = int(floor(gridXZ.y));
        float fx = gridXZ.x - float(ix);
        float fz = gridXZ.y - float(iz);
        float d00 = uDensity[ix * 25 + iz];
        float d10 = uDensity[(ix + 1) * 25 + iz];
        float d01 = uDensity[ix * 25 + (iz + 1)];
        float d11 = uDensity[(ix + 1) * 25 + (iz + 1)];
        float dx0 = mix(d00, d10, fx);
        float dx1 = mix(d01, d11, fx);
        return mix(dx0, dx1, fz);
      }

      // r_eff は dataset 平均値 1 個で代用 (= 完全な空間分布は uniform 配列 limit 超過の制約)
      float sampleReff(vec3 p) {
        return uReffMean_um;
      }

      // Henyey-Greenstein phase function (= 雲粒の散乱角分布近似)
      // g: 非対称パラメータ (= 雲粒は前方散乱優位、 g=0.85 典型)
      float hg(float cosTheta, float g) {
        float denom = 1.0 + g * g - 2.0 * g * cosTheta;
        return (1.0 - g * g) / (12.566 * denom * sqrt(max(denom, 1e-6)));
      }
      // 2-lobe HG = 前方鋭いピーク + 後方緩い、 業界標準近似 (= takram / Schneider / Bauer 系)
      float twoLobeHG(float cosTheta) {
        return 0.5 * hg(cosTheta, 0.85) + 0.5 * hg(cosTheta, -0.3);
      }

      float sampleDensity(vec3 p) {
        vec3 t = (p - uBoxMin) / (uBoxMax - uBoxMin);
        // PySDM 2D Kinematic は (x, z) 平面 = (水平, 高度)、 viewer 軸との対応:
        //   PySDM x → viewer x (= 水平)
        //   PySDM z → viewer y (= 高度) ← ここが重要
        //   viewer z (= 奥行き) は density 一様 + 端 fade (= 厚み 300m 程度に絞る)
        vec2 gridXZ = vec2(t.x, t.y) * 24.0;
        float d2d = sampleDensity2D(gridXZ);
        // 「らしさ」 を作らず、 PySDM 出力 ql (= 雲水質量比 g/kg) を voxel として
        // 素直に sampling。 z 方向 (= 視点奥行き) は 2D 場の単純押し出し、 端の薄い
        // fade のみ (= 板の境界を物理量で表現できないので、 形状的に薄める最小限)。
        float zCenter = 0.5;
        float zRadius = 0.25;
        float zDist = abs(t.z - zCenter);
        float zFade = smoothstep(zRadius, zRadius * 0.7, zDist);
        return max(0.0, d2d / uDensityMax) * zFade;
      }

      vec2 rayBoxIntersect(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax) {
        vec3 inv = 1.0 / rd;
        vec3 t0 = (bmin - ro) * inv;
        vec3 t1 = (bmax - ro) * inv;
        vec3 tmin = min(t0, t1);
        vec3 tmax = max(t0, t1);
        float tNear = max(max(tmin.x, tmin.y), tmin.z);
        float tFar = min(min(tmax.x, tmax.y), tmax.z);
        return vec2(tNear, tFar);
      }

      void main() {
        vec3 ro = uCameraPos;
        vec3 rd = normalize(vWorldPos - ro);

        vec2 tHit = rayBoxIntersect(ro, rd, uBoxMin, uBoxMax);
        float tNear = max(tHit.x, 0.0);
        float tFar = tHit.y;

        if (tFar <= tNear) {
          discard;
        }

        const int STEPS = 96;
        float tStep = (tFar - tNear) / float(STEPS);
        float transmittance = 1.0;
        vec3 color = vec3(0.0);

        vec3 sky = vec3(0.45, 0.6, 0.85);

        if (uMode == 0) {
          // ----- voxel mode: 既存、 物理量を素直に sampling -----
          vec3 cloudColor = vec3(1.0, 0.98, 0.95);
          vec3 shadowColor = vec3(0.55, 0.62, 0.75);
          for (int i = 0; i < STEPS; i++) {
            float t = tNear + (float(i) + 0.5) * tStep;
            vec3 p = ro + rd * t;
            float d = sampleDensity(p);
            if (d > 0.05) {
              vec3 lp = p + uSunDir * 80.0;
              float dl = sampleDensity(lp);
              float lightAtten = exp(-dl * 2.0);
              vec3 sampleC = mix(shadowColor, cloudColor, lightAtten);
              float a = 1.0 - exp(-d * tStep * 0.03);
              color += transmittance * a * sampleC;
              transmittance *= (1.0 - a);
              if (transmittance < 0.02) break;
            }
          }
        } else {
          // ----- scatter mode: ミー散乱物理駆動 -----
          // σ_ext = 3 ρ_air ql / (2 ρ_water r_eff)、 雲粒の物理から計算
          // r_eff は dataset 平均が雲なし cell を含むため typical 雲内値で補正
          float cosTheta = dot(rd, uSunDir);
          float phase = twoLobeHG(cosTheta);
          float rho_air = 1.0;
          float rho_water = 1000.0;
          float reff_um_inside = max(uReffMean_um * 2.5, 10.0);  // 雲内 typical 値
          float reff_m = reff_um_inside * 1e-6;
          // σ_ext 係数 (= ql 1 単位あたり)
          float sigma_per_ql = 3.0 * rho_air / (2.0 * rho_water * reff_m);
          vec3 cloudAlbedo = vec3(0.97);
          for (int i = 0; i < STEPS; i++) {
            float t = tNear + (float(i) + 0.5) * tStep;
            vec3 p = ro + rd * t;
            float dn = sampleDensity(p);
            if (dn > 0.02) {
              float ql_kgkg = dn * uQlMax_gkg * 1e-3;
              float sigma_ext = sigma_per_ql * ql_kgkg;
              // direct light atten = 太陽方向に 2 step、 距離 30m 程度 (= 光路短縮)
              float lightOpticalDepth = 0.0;
              for (int j = 1; j <= 2; j++) {
                vec3 lp = p + uSunDir * 30.0 * float(j);
                float dn_l = sampleDensity(lp);
                if (dn_l > 0.0) {
                  float ql_l = dn_l * uQlMax_gkg * 1e-3;
                  lightOpticalDepth += sigma_per_ql * ql_l * 30.0;
                }
              }
              float lightAtten = exp(-lightOpticalDepth);
              vec3 directLight = vec3(1.4, 1.35, 1.25) * lightAtten * (phase * 2.0 + 0.5);  // 直射 + 等方
              vec3 ambientLight = sky * 1.0;  // multi-scatter 強化 (= 雲は ambient で明るい)
              vec3 sampleColor = cloudAlbedo * (directLight + ambientLight);
              float a = 1.0 - exp(-sigma_ext * tStep);
              color += transmittance * a * sampleColor;
              transmittance *= (1.0 - a);
              if (transmittance < 0.02) break;
            }
          }
        }

        vec3 finalColor = color + transmittance * sky;
        float alpha = 1.0 - transmittance;

        gl_FragColor = vec4(finalColor, alpha + 0.001);
      }
    `;

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    async function fetchBinary(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      return new Float32Array(buf);
    }

    async function main() {
      let catalog;
      try {
        const res = await fetch("catalog.json");
        catalog = await res.json();
      } catch (e) {
        setText("meta-grid", "catalog.json の取得失敗: " + e.message);
        return;
      }

      const datasetKeys = Object.keys(catalog.datasets);
      if (datasetKeys.length === 0) {
        setText("meta-grid", "dataset が空");
        return;
      }
      const urlParams = new URLSearchParams(window.location.search);

      // 現在の選択
      const state = {
        dataset: urlParams.get("dataset") || datasetKeys[0],
        product: urlParams.get("product") || "ql",
        step: parseInt(urlParams.get("step") || "18", 10),
        // 各 product binary を ArrayBuffer cache (= dataset 切替時に解放)
        bins: {},   // key: `${dataset}_${product}`、 value: Float32Array (= 91*625)
        productMax: 1.0,
      };

      function currentProductMeta() {
        return catalog.datasets[state.dataset].products[state.product];
      }

      setText("meta-grid", `grid: 25×25 (= 25×25, 60m/cell, 1500m domain)`);

      const container = document.getElementById("canvas-container");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x6a90c0);

      const CAMERA_PRESETS = {
        iso:   { pos: [3000, 1800, 3000], target: [750, 750, 750], label: "iso (= 俯瞰)" },
        top:   { pos: [750, 3500, 750.1], target: [750, 750, 750], label: "top (= 真上)" },
        side:  { pos: [4500, 750, 750],  target: [750, 750, 750], label: "side (= 真横、 鉛直断面)" },
        close: { pos: [2200, 1200, 2200], target: [750, 750, 750], label: "close (= 接近)" },
      };
      const camKey = CAMERA_PRESETS[urlParams.get("cam")] ? urlParams.get("cam") : "iso";

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 20000);
      function applyCameraPreset(key) {
        const p = CAMERA_PRESETS[key];
        camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
        camera.lookAt(p.target[0], p.target[1], p.target[2]);
      }
      applyCameraPreset(camKey);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      // applyCameraPreset を controls 経由で再適用 (= target も同期)
      function setCameraPreset(key) {
        const p = CAMERA_PRESETS[key];
        camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
        controls.target.set(p.target[0], p.target[1], p.target[2]);
        controls.update();
        const buttons = document.querySelectorAll("#cam-buttons button");
        buttons.forEach(b => b.classList.toggle("active", b.dataset.cam === key));
      }
      setCameraPreset(camKey);

      // cam button 群
      const camButtonsDiv = document.getElementById("cam-buttons");
      Object.keys(CAMERA_PRESETS).forEach(key => {
        const btn = document.createElement("button");
        btn.textContent = CAMERA_PRESETS[key].label;
        btn.dataset.cam = key;
        btn.onclick = () => setCameraPreset(key);
        camButtonsDiv.appendChild(btn);
      });

      // Save PNG handler (= canvas → blob → download)
      document.getElementById("save-png").onclick = () => {
        renderer.render(scene, camera);
        renderer.domElement.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `pysdm_${state.dataset}_${state.product}_step${state.step}_cam${camKey}_${Date.now()}.png`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      };

      // 折りたたみ button
      const infoDiv = document.getElementById("info");
      document.getElementById("collapse-btn").onclick = () => {
        infoDiv.classList.toggle("collapsed");
        document.getElementById("collapse-btn").textContent =
          infoDiv.classList.contains("collapsed") ? "+" : "×";
      };

      // URL ?nopanel=1 で初期から折りたたみ
      if (urlParams.get("nopanel") === "1") {
        infoDiv.classList.add("collapsed");
        document.getElementById("collapse-btn").textContent = "+";
      }

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(6000, 6000, 10, 10),
        new THREE.MeshBasicMaterial({ color: 0x2d4520, wireframe: true })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const boxSize = 1500;
      const boxMin = new THREE.Vector3(0, 0, 0);
      const boxMax = new THREE.Vector3(boxSize, boxSize, boxSize);

      const cloudGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
      cloudGeo.translate(boxSize / 2, boxSize / 2, boxSize / 2);

      const uniforms = {
        uCameraPos: { value: camera.position },
        uDensity: { value: new Float32Array(625) },
        uReffMean_um: { value: 10.0 },               // 雲粒有効半径平均 [μm]、 dataset から更新
        uDensityMax: { value: 1.0 },
        uQlMax_gkg: { value: 1.0 },                  // ql global max [g/kg] 物理復元
        uBoxMin: { value: boxMin },
        uBoxMax: { value: boxMax },
        uSunDir: { value: new THREE.Vector3(-0.4, 0.8, 0.3).normalize() },
        uMode: { value: urlParams.get("mode") === "voxel" ? 0 : 1 },  // default = scatter
      };

      const cloudMat = new THREE.ShaderMaterial({
        vertexShader: VERT,
        fragmentShader: FRAG,
        uniforms,
        transparent: true,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
      scene.add(cloudMesh);

      // dataset binary を必要に応じて fetch (= cache)
      async function ensureBin() {
        const key = `${state.dataset}_${state.product}`;
        if (state.bins[key]) return state.bins[key];
        const meta = currentProductMeta();
        if (!meta) throw new Error(`product ${state.product} 無し`);
        const arr = await fetchBinary(meta.bin_file);
        state.bins[key] = arr;
        return arr;
      }

      // 別 product (= ql or r_eff) を fetch する helper
      async function ensureBinFor(productKey) {
        const key = `${state.dataset}_${productKey}`;
        if (state.bins[key]) return state.bins[key];
        const meta = catalog.datasets[state.dataset].products[productKey];
        if (!meta) return null;
        const arr = await fetchBinary(meta.bin_file);
        state.bins[key] = arr;
        return arr;
      }

      // 現 state の step を uniform に転送 + 表示更新
      async function refreshVoxel() {
        const arr = await ensureBin();
        const meta = currentProductMeta();
        const stepArr = arr.subarray(state.step * 625, (state.step + 1) * 625);
        const u = uniforms.uDensity.value;
        for (let i = 0; i < 625; i++) u[i] = stepArr[i];
        state.productMax = meta.max > 0 ? meta.max : 1.0;
        uniforms.uDensityMax.value = state.productMax;

        // scatter mode = ql + r_eff 平均値 を uniform に
        const qlMeta = catalog.datasets[state.dataset].products.ql;
        const reffMeta = catalog.datasets[state.dataset].products.effective_radius;
        if (qlMeta) uniforms.uQlMax_gkg.value = qlMeta.max;
        if (reffMeta) uniforms.uReffMean_um.value = Math.max(reffMeta.mean, 1.0);
        // scatter mode で uDensity を ql 強制 (= state.product が ql 以外でも物理駆動)
        if (uniforms.uMode.value === 1) {
          const qlArr = await ensureBinFor("ql");
          if (qlArr) {
            const qlStep = qlArr.subarray(state.step * 625, (state.step + 1) * 625);
            for (let i = 0; i < 625; i++) u[i] = qlStep[i];
            uniforms.uDensityMax.value = qlMeta.max;
          }
        }
        cloudMat.uniformsNeedUpdate = true;

        // step あたりの実効 max を計算 (= 表示用)
        let maxV = 0;
        for (let i = 0; i < 625; i++) maxV = Math.max(maxV, stepArr[i]);
        setText("meta-product",
          `${state.dataset} / ${state.product} [${meta.unit}]  step ${state.step}/${meta.n_step - 1}  ` +
          `(this step max: ${maxV.toFixed(3)}, global max: ${meta.max.toFixed(3)})`);
        document.title = `PySDM ${state.dataset}/${state.product} step ${state.step}`;
        document.getElementById("time-label").textContent = `step ${state.step}`;
        document.getElementById("time-slider").max = (meta.n_step - 1).toString();
        document.getElementById("time-slider").value = state.step.toString();
      }

      // dataset selector
      const datasetButtonsDiv = document.getElementById("dataset-buttons");
      datasetKeys.forEach(key => {
        const btn = document.createElement("button");
        btn.textContent = `${key} (${catalog.datasets[key].products.ql ? "max " + catalog.datasets[key].products.ql.max.toFixed(2) + " g/kg" : "n/a"})`;
        btn.dataset.dataset = key;
        btn.onclick = () => {
          state.dataset = key;
          updateActiveStates();
          refreshVoxel();
        };
        datasetButtonsDiv.appendChild(btn);
      });

      // product selector (= ql / n_c_cm3 / effective_radius / super_droplet_count)
      const productButtonsDiv = document.getElementById("product-buttons");
      const productKeys = Object.keys(catalog.datasets[state.dataset].products);
      productKeys.forEach(key => {
        const btn = document.createElement("button");
        btn.textContent = key;
        btn.dataset.product = key;
        btn.onclick = () => {
          state.product = key;
          updateActiveStates();
          refreshVoxel();
        };
        productButtonsDiv.appendChild(btn);
      });

      function updateActiveStates() {
        document.querySelectorAll("#dataset-buttons button").forEach(b =>
          b.classList.toggle("active", b.dataset.dataset === state.dataset));
        document.querySelectorAll("#product-buttons button").forEach(b =>
          b.classList.toggle("active", b.dataset.product === state.product));
      }

      // time slider
      document.getElementById("time-slider").addEventListener("input", (e) => {
        state.step = parseInt(e.target.value, 10);
        refreshVoxel();
      });

      // mode 切替 button
      const modeButtonsDiv = document.getElementById("mode-buttons");
      [
        { key: "scatter", label: "scatter (= ミー散乱 物理駆動)", value: 1 },
        { key: "voxel",   label: "voxel (= 物理量 直出し)",       value: 0 },
      ].forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt.label;
        btn.dataset.mode = opt.key;
        btn.onclick = () => {
          uniforms.uMode.value = opt.value;
          cloudMat.uniformsNeedUpdate = true;
          modeButtonsDiv.querySelectorAll("button").forEach(b =>
            b.classList.toggle("active", b.dataset.mode === opt.key));
          refreshVoxel();
        };
        modeButtonsDiv.appendChild(btn);
      });
      // 初期 mode の active 表示
      const initModeKey = uniforms.uMode.value === 1 ? "scatter" : "voxel";
      modeButtonsDiv.querySelectorAll("button").forEach(b =>
        b.classList.toggle("active", b.dataset.mode === initModeKey));

      updateActiveStates();
      await refreshVoxel();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        uniforms.uCameraPos.value.copy(camera.position);
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    }

    main();
  </script>
</body>
</html>
